; NRFTW Action Voice Probe audio bindings.
; Binding value: EventName；多个 Event 使用英文逗号分隔，每次随机播放一个
; See BINDING_KEYS.md for key names and meanings.

[general]
; 是否启用插件
enabled=true
; 同一绑定两次播放之间的最短间隔，单位为毫秒
cooldownMs=250
; 按住攻击超过此时间后播放蓄力开始，单位为毫秒
chargeDelayMs=200
; 持续下落超过此时间后播放坠落过程音效，单位为毫秒
fallDelayMs=300
; 启动时是否输出诊断信息
startupDiagnostic=false
; 启动时是否导出武器和符文映射表
exportMap=false
; 日志级别：none、debug、info、warning 或 error
logLevel=none

[audio]
; 所有音频的默认播放速率倍率；最终速率 = 动作基础速率 * 配置倍率
rate.default=1.0
; 可按最终命中的 binding key 覆盖，例如：rate.basicAttack=1.0、rate.plagueNova=1.1

[actions]
; 基础攻击，其他攻击 key 未配置时使用此绑定
basicAttack=nrftw_action_voice_basic_attack
; 蓄力攻击开始
chargedAttackStart=nrftw_action_voice_charged_attack_start
; 蓄力攻击结束
chargedAttackStop=nrftw_action_voice_charged_attack_stop
; 翻滚
dodgeRoll=nrftw_action_voice_dodge_roll
; 快步
quickstep=nrftw_action_voice_quickstep
; 使用道具或消耗品
itemUse=nrftw_action_voice_item_use
; 玩家执行背刺
backstab=nrftw_action_voice_backstab
; 本地玩家开始肩撞动作
shoulderBarge=
; 本地玩家角色等级提升
playerLevelUp=
; 玩家持续坠落
playerFall=nrftw_action_voice_player_fall
; 玩家坠落死亡
playerDeath.fall=nrftw_action_voice_player_death_fall
; 玩家死于背刺
playerDeath.backstab=nrftw_action_voice_player_death_backstab
; 玩家死于处决
